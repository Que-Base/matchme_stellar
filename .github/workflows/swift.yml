# Build and test the MatchMe Xcode project on every PR targeting main.
#
# This project is an Xcode app (matchme.mobile_swift.xcodeproj), NOT a
# Swift Package. The correct tool is xcodebuild, not `swift build`.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Log the Xcode version available on the runner for debugging
      - name: Show Xcode version
        run: xcodebuild -version

      # List available simulators so we can pin an exact destination
      - name: List available simulators
        run: xcrun simctl list devices available --json | python3 -c "
import json, sys
data = json.load(sys.stdin)
for runtime, devices in data['devices'].items():
    for d in devices:
        if 'iPhone' in d['name']:
            print(runtime, '|', d['name'], '|', d['udid'])
" | sort | tail -20

      # Resolve SPM dependencies declared inside the Xcode project
      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project matchme.mobile_swift.xcodeproj \
            -scheme matchme.mobile_swift \
            -clonedSourcePackagesDirPath .spm-cache

      # Build for the iOS Simulator — no code signing required
      - name: Build
        run: |
          xcodebuild \
            -project matchme.mobile_swift.xcodeproj \
            -scheme matchme.mobile_swift \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcpretty || xcodebuild \
              -project matchme.mobile_swift.xcodeproj \
              -scheme matchme.mobile_swift \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
              -clonedSourcePackagesDirPath .spm-cache \
              CODE_SIGNING_ALLOWED=NO \
              build

      # Run tests (will be a no-op until a test target is added — ISS-041)
      - name: Test
        run: |
          xcodebuild \
            -project matchme.mobile_swift.xcodeproj \
            -scheme matchme.mobile_swift \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | grep -E "Test session|error:|warning:|PASSED|FAILED" \
            || echo "No test targets found — skipping (see ISS-041)"
